<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Task Manager — Progress Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div>
          <h1>Task Manager — Progress Tracker</h1>
          <div class="sub">
            Add, edit, complete & delete tasks. Progress saved in Local Storage.
          </div>
        </div>
        <div>
          <button id="btnNew" class="btn primary">+ New Task</button>
        </div>
      </header>

      <div class="layout">
        <main>
          <div class="card">
            <div class="controls">
              <input id="search" class="input" placeholder="Search tasks..." />
              <select id="filter" class="select">
                <option value="all">All</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
              </select>
              <select id="sort" class="select">
                <option value="created_desc">Newest</option>
                <option value="created_asc">Oldest</option>
                <option value="due_asc">Due soon</option>
                <option value="due_desc">Due latest</option>
              </select>
              <button id="clearCompleted" class="btn">Clear Completed</button>
              <div
                style="
                  margin-left: auto;
                  color: var(--muted);
                  align-self: center;
                "
                id="counts"
              ></div>
            </div>

            <div id="tasks" class="list" aria-live="polite"></div>
            <footer>
              Tip: Click the checkbox at left to mark complete. Use Edit to
              change task details.
            </footer>
          </div>
        </main>

        <aside class="sidebar">
          <div class="card progress">
            <h3 style="margin: 0">Progress</h3>
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-top: 8px;
                align-items: center;
              "
            >
              <div class="sub">Completion</div>
              <div id="progressPercent">0%</div>
            </div>
            <div
              style="margin-top: 10px"
              class="progress-bar"
              aria-hidden="true"
            >
              <i id="progressFill"></i>
            </div>
            <div
              style="margin-top: 10px; color: var(--muted); font-size: 13px"
              id="summary"
            >
              No tasks yet
            </div>
          </div>

          <div class="card">
            <h4 style="margin: 0">Quick add</h4>
            <div style="margin-top: 10px; display: flex; gap: 8px">
              <input id="quickTitle" class="input" placeholder="Task title" />
              <button id="quickAdd" class="btn primary">Add</button>
            </div>
            <div style="margin-top: 8px; color: var(--muted); font-size: 13px">
              Add fast tasks from sidebar.
            </div>
          </div>

          <div class="card">
            <h4 style="margin: 0">Filters</h4>
            <div style="display: flex; gap: 8px; margin-top: 10px">
              <button data-filter="all" class="btn small">All</button>
              <button data-filter="active" class="btn small">Active</button>
              <button data-filter="completed" class="btn small">
                Completed
              </button>
            </div>
          </div>
        </aside>
      </div>

      <!-- modal -->
      <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true">
        <div class="modal card">
          <h3 id="modalTitle">New Task</h3>
          <form id="taskForm">
            <input type="hidden" id="taskId" />
            <div class="row" style="margin-top: 8px">
              <div class="col">
                <label for="title">Title</label>
                <input id="title" class="input" required />
              </div>
              <div style="width: 160px">
                <label for="due">Due</label>
                <input id="due" type="date" class="input" />
              </div>
            </div>
            <div style="margin-top: 10px">
              <label for="desc">Description</label>
              <textarea
                id="desc"
                rows="3"
                class="input"
                style="resize: vertical; width: 100%"
              ></textarea>
            </div>

            <div
              style="
                display: flex;
                gap: 8px;
                margin-top: 12px;
                justify-content: flex-end;
              "
            >
              <button type="button" id="cancel" class="btn ghost">
                Cancel
              </button>
              <button type="submit" class="btn primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
